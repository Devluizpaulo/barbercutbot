version: '3.9'

# =============================================
# DOCKER COMPOSE - PRODUÇÃO GCP FREE TIER
# Otimizado para 1GB RAM
# =============================================

services:
  # =============================================
  # EVOLUTION API - WhatsApp Integration
  # =============================================
  evolution-api:
    image: atendai/evolution-api:v2.1.1
    container_name: evolution_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # URLs
      - SERVER_URL=${SERVER_URL}
      
      # Database (SQLite - mais leve)
      - DATABASE_PROVIDER=
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_prod
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=false
      - DATABASE_SAVE_DATA_CONTACTS=false
      - DATABASE_SAVE_DATA_CHATS=false
      
      # Authentication
      - AUTHENTICATION_API_KEY=${AUTHENTICATION_API_KEY}
      
      # Session
      - CONFIG_SESSION_PHONE_CLIENT=Evolution
      - CONFIG_SESSION_PHONE_NAME=Chrome
      
      # Webhook
      - WEBHOOK_GLOBAL_URL=http://n8n:5678/webhook/whatsapp
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
      - WEBHOOK_EVENTS_CONNECTION_UPDATE=true
      - WEBHOOK_EVENTS_MESSAGES_SET=false
      - WEBHOOK_EVENTS_MESSAGES_UPDATE=false
      - WEBHOOK_EVENTS_SEND_MESSAGE=false
      - WEBHOOK_EVENTS_CONTACTS_SET=false
      - WEBHOOK_EVENTS_CHATS_SET=false
      
      # Logs (mínimos)
      - LOG_LEVEL=ERROR
      - LOG_COLOR=false
      - LOG_BAILEYS=error
      
      # CORS
      - CORS_ORIGIN=*
      - CORS_METHODS=GET,POST,PUT,DELETE
      - CORS_CREDENTIALS=true
    
    volumes:
      - evolution_data:/evolution/instances
      - ./logs/evolution:/evolution/logs
    
    networks:
      - saas_network
    
    # Limites de recursos (IMPORTANTE para 1GB RAM)
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    
    # Health check
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Logging otimizado
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =============================================
  # N8N - Workflow Automation
  # =============================================
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n_automation
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # URLs
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=${WEBHOOK_URL}
      
      # Authentication
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      
      # Timezone
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
      
      # Encryption
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      
      # Executions (economizar espaço)
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=none
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      
      # Performance
      - N8N_METRICS=false
      - N8N_DIAGNOSTICS_ENABLED=false
    
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n-workflows:/backup/workflows:ro
    
    networks:
      - saas_network
    
    # Limites de recursos
    mem_limit: 400m
    mem_reservation: 200m
    cpus: 0.5
    
    # Depende da Evolution API
    depends_on:
      evolution-api:
        condition: service_healthy
    
    # Health check
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:5678 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Logging otimizado
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# =============================================
# VOLUMES
# =============================================
volumes:
  evolution_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/lib/evolution-data
  
  n8n_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/lib/n8n-data

# =============================================
# NETWORKS
# =============================================
networks:
  saas_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

