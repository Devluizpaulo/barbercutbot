# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

# Specifies the node version to use when building and running your app.
# The following versions are supported: 20, 18, 16.
runtime: nodejs20

# Specifies the command to run your app on the server.
# The 'npm start' script in package.json is used by default.
# entrypoint: npm start

# Settings to manage your server's resources.
# https://firebase.google.com/docs/app-hosting/configure-backend#resources
resources:
  cpu: 1
  memoryMiB: 1024

# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure
runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 1
